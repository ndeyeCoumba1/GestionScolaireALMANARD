# Application name
spring.application.name=GestionScolaire

# PostgreSQL database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestionscolaire}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:binta}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Security with JWT
jwt.secret=${JWT_SECRET:almanard3s_secret_key_2024_very_long_key_for_security}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server port
server.port=8080
